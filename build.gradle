buildscript {
    ext {
        aboutLibrariesVersion = '14.2.1'

        repos = {
            google()
            mavenCentral()
            maven { url "https://jitpack.io" }
            maven { url "https://plugins.gradle.org/m2" }
        }
    }

    repositories repos

    dependencies {
        // FIXME: Breaks aboutlibraries' resource generation
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:$aboutLibrariesVersion"
    }
}

allprojects {
    repositories repos
}