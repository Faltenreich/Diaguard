org.gradle.daemon=true
org.gradle.jvmargs=-Xms512M -Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options="-Xmx1g" -XX:+HeapDumpOnOutOfMemoryError
android.enableJetifier=true
android.useAndroidX=true
android.newDsl=false
# Workaround for additionalTestOutput is not supported on this device running API level 23
android.enableAdditionalTestOutput=false